<div class="create-container">
  <div class="create-card">
    <h1 class="create-title">
      <span>Create user</span>
    </h1>

    <form
      pFocusTrap
      class="create-form"
      [formGroup]="createForm"
      (ngSubmit)="onSubmit()"
    >
      <p class="create-subtitle">
        Enter the user personal data to create user account.
      </p>

      <div class="form-field">
        <!-- Name Field -->
        <div class="name-Input">
          <p-floatlabel variant="on">
            <input
              pInputText
              id="name"
              type="text"
              formControlName="name"
              [pAutoFocus]="true"
            />
            <label for="name">Name</label>
          </p-floatlabel>
          <div class="error-message">
            <p-message
              *ngIf="getError('Invalid Name') || getErrorStart('Name')"
              severity="error"
              variant="simple"
              size="small"
            >
              {{ getError("Invalid Name") || getErrorStart("Name") }}
            </p-message>
          </div>
        </div>

        <!-- Email Field -->
        <div class="email-Input">
          <p-floatlabel variant="on">
            <input pInputText id="email" type="email" formControlName="email" />
            <label for="email">Email Address</label>
          </p-floatlabel>
          <div class="error-message">
            <p-message
              *ngIf="getError('Email')"
              severity="error"
              variant="simple"
              size="small"
            >
              {{ getError("Email") }}
            </p-message>
          </div>
        </div>

        <!-- Phone Field -->
        <div class="phone-Input">
          <p-floatlabel variant="on">
            <input pInputText id="phone" type="tel" formControlName="phone" />
            <label for="phone">Phone</label>
          </p-floatlabel>
          <div class="error-message">
            <p-message
              *ngIf="getError('Phone')"
              severity="error"
              variant="simple"
              size="small"
            >
              {{ getError("Phone") }}
            </p-message>
          </div>
        </div>

        <!-- UserName Field -->
        <div class="userName-Input">
          <p-floatlabel variant="on">
            <input
              pInputText
              id="userName"
              type="text"
              formControlName="userName"
            />
            <label for="userName">UserName</label>
          </p-floatlabel>
          <div class="error-message">
            <p-message
              *ngIf="getError('UserName')"
              severity="error"
              variant="simple"
              size="small"
            >
              {{ getError("UserName") }}
            </p-message>
          </div>
        </div>

        <!-- profileImage Field -->
        <div class="profileImage-Input">
          <p-floatlabel variant="on">
            <input
              pInputText
              id="profileImage"
              type="text"
              formControlName="profileImage"
            />
            <label for="profileImage">profileImage</label>
          </p-floatlabel>
          <div class="error-message">
            <p-message
              *ngIf="getError('profileImage')"
              severity="error"
              variant="simple"
              size="small"
            >
              {{ getError("profileImage") }}
            </p-message>
          </div>
        </div>

        <!-- role Field -->
        <div class="role-Input">
          <p-floatlabel variant="on">
            <input pInputText id="role" type="role" formControlName="role" />
            <label for="role">role</label>
          </p-floatlabel>
          <div class="error-message">
            <p-message
              *ngIf="getError('role')"
              severity="error"
              variant="simple"
              size="small"
            >
              {{ getError("role") }}
            </p-message>
          </div>
        </div>
      </div>

      <!-- Create Button -->
      <button
        pButton
        type="submit"
        label="Create"
        class="create-btn"
        icon="pi pi-user-plus"
        styleClass="p-button-warning"
      ></button>

      <!-- Cansel Button -->
      <button
        pButton
        label="Cansel"
        class="cansel-btn"
        icon="pi pi-times"
        styleClass="p-button-warning"
        routerLink="/admin/user"
      ></button>

      <!-- isActive Field -->
      <div class="isActive-Input">
        <p-inputgroup>
          <p-inputgroup-addon class="isActive-button">
            <p-button
              class="Active-button"
              *ngIf="active()"
              [rounded]="true"
              [text]="true"
              (click)="clickEvent($event)"
              ><i class="pi pi-check" style="color: white"></i
            ></p-button>
            <p-button
              class="unActive-button"
              *ngIf="!active()"
              [rounded]="true"
              [text]="true"
              (click)="clickEvent($event)"
              ><i class="pi pi-times" style="color: white"></i
            ></p-button>
            
          </p-inputgroup-addon><label for="isActive">IsActive</label>
        </p-inputgroup>
      </div>
    </form>
  </div>
</div>
