<p-dialog
  maskStyleClass="backdrop-blur-sm"
  class="dialog"
  [draggable]="false"
  [resizable]="false"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [(visible)]="visible"
>
  <ng-template #headless>
    <div class="edit-container">
      <div class="edit-card">
        <h1 class="edit-title">
          <span>Edit User</span>
        </h1>

        <form
          pFocusTrap
          class="edit-form"
          [formGroup]="editForm()"
          (ngSubmit)="onSubmit()"
        >
          <div class="form-field">
            <!-- Name Field -->
            <div class="name-Input">
              <p-floatlabel variant="on">
                <input
                  pInputText
                  id="name"
                  type="text"
                  formControlName="name"
                  [pAutoFocus]="true"
                />
                <label for="name">Name</label>
              </p-floatlabel>
              <div class="error-message">
                <p-message
                  *ngIf="getError('name')"
                  severity="error"
                  variant="simple"
                  size="small"
                >
                  {{ getError("name") }}
                </p-message>
              </div>
            </div>

            <!-- Email Field -->
            <div class="email-Input">
              <p-floatlabel variant="on">
                <input
                  pInputText
                  id="email"
                  type="email"
                  formControlName="email"
                />
                <label for="email">Email Address</label>
              </p-floatlabel>
              <div class="error-message">
                <p-message
                  *ngIf="getError('Email')"
                  severity="error"
                  variant="simple"
                  size="small"
                >
                  {{ getError("Email") }}
                </p-message>
              </div>
            </div>

            <!-- Phone Field -->
            <div class="phone-Input">
              <p-floatlabel variant="on">
                <input
                  pInputText
                  id="phone"
                  type="email"
                  formControlName="phone"
                />
                <label for="phone">Phone</label>
              </p-floatlabel>
              <div class="error-message">
                <p-message
                  *ngIf="getError('phone')"
                  severity="error"
                  variant="simple"
                  size="small"
                >
                  {{ getError("phone") }}
                </p-message>
              </div>
            </div>

            <!-- UserName Field -->
            <div class="userName-Input">
              <p-floatlabel variant="on">
                <input
                  pInputText
                  id="userName"
                  type="text"
                  formControlName="userName"
                />
                <label for="userName">UserName</label>
              </p-floatlabel>
              <div class="error-message">
                <p-message
                  *ngIf="getError('userName')"
                  severity="error"
                  variant="simple"
                  size="small"
                >
                  {{ getError("userName") }}
                </p-message>
              </div>
            </div>

            <!-- Password Field -->
            <div class="password-container">
              <p-floatlabel variant="on">
                <p-inputgroup>
                  <input
                    pPassword
                    class="password-Input"
                    id="password"
                    [feedback]="false"
                    [type]="hide() ? 'password' : 'text'"
                    formControlName="password"
                    variant="filled"
                  />

                  <p-inputgroup-addon class="Eye-button">
                    <p-button
                      *ngIf="hide()"
                      [rounded]="true"
                      [text]="true"
                      (click)="clickHidePasswordEvent($event)"
                      icon="pi pi-eye"
                    />
                    <p-button
                      *ngIf="!hide()"
                      [rounded]="true"
                      [text]="true"
                      (click)="clickHidePasswordEvent($event)"
                      icon="pi pi-eye-slash"
                    />
                  </p-inputgroup-addon>
                </p-inputgroup>

                <label for="password">Password</label>
              </p-floatlabel>
              <div class="error-message">
                <p-message
                  *ngIf="getError('Invalid Password')"
                  severity="error"
                  variant="simple"
                  size="small"
                >
                  {{ getError("Invalid Password") }}
                </p-message>
              </div>
            </div>

            <!-- ProfileImage Field -->
            <div class="profileImage-Input">
              <p-floatlabel variant="on">
                <input
                  pInputText
                  id="profileImage"
                  type="text"
                  formControlName="profileImage"
                />
                <label for="profileImage">ProfileImage</label>
              </p-floatlabel>
              <div class="error-message">
                <p-message
                  *ngIf="getError('profileImage')"
                  severity="error"
                  variant="simple"
                  size="small"
                >
                  {{ getError("profileImage") }}
                </p-message>
              </div>
            </div>

            <!-- Role Field -->
            <div class="role-Input">
              <p-floatlabel variant="on">
                <input
                  pInputText
                  id="role"
                  type="text"
                  formControlName="role"
                />
                <label for="role">Role</label>
              </p-floatlabel>
              <div class="error-message">
                <p-message
                  *ngIf="getError('role')"
                  severity="error"
                  variant="simple"
                  size="small"
                >
                  {{ getError("role") }}
                </p-message>
              </div>
            </div>
          </div>

          <!-- isActive Field -->
          <div class="isActive-Input">
            <p-inputgroup>
              <div class="isActive-button">
                <p-button
                  class="Active-button"
                  *ngIf="editForm().get('isActive')?.value"
                  [rounded]="true"
                  [text]="true"
                  (click)="clickActiveEvent($event)"
                  ><i class="pi pi-check" style="color: white"></i
                ></p-button>
              </div>

              <p-button
                class="unActive-button"
                *ngIf="!editForm().get('isActive')?.value"
                [rounded]="true"
                [text]="true"
                (click)="clickActiveEvent($event)"
                ><i class="pi pi-times" style="color: white"></i
              ></p-button>

              <label for="isActive">IsActive</label>
            </p-inputgroup>
          </div>

          <!-- button  -->
          <div class="action-btn"> 
            
            <p-button
              label="save"
              type="submit"
              [text]="true"
              styleClass="!p-4 w-full !text-primary-50 !border !border-white/30 hover:!bg-white/10"
              class="w-full"
            />

            <p-button
              label="Cancel"
              (click)="closeDialog()"
              [text]="true"
              styleClass="!p-4 w-full !text-primary-50 !border !border-white/30 hover:!bg-white/10"
              class="w-full"
           severity="danger"
            />
           
          </div>
        </form>
      </div>
    </div>
  </ng-template>
</p-dialog>
